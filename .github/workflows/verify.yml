name: Verify prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development tooling
        run: npm ci --ignore-scripts
      - name: Verify standalone Pages publisher syntax
        run: node --check scripts/publish-dojo-pages.mjs && node --check scripts/sync-dojo-assets.mjs && node --check scripts/verify-dojo-ragdoll.mjs
      - name: Block missing or corrupt Pages assets
        run: node scripts/verify-pages-pack.mjs
      - name: Check ragdoll in the exact standalone pack
        run: node scripts/verify-dojo-ragdoll.mjs
      - name: Syntax, unit tests and TypeScript checks
        run: npm run check
