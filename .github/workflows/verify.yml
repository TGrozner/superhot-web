name: Verify prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development tooling
        run: npm ci --ignore-scripts
      - name: Syntax, unit tests and TypeScript checks
        run: npm run check
